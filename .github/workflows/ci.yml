name: Local mail qualification
on:
  push:
    branches: [master, feat/verde2-production-mail]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verde2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    # Six cold builds, bounded 20-minute load wait, physical restore and serial scans.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: History secrets gate
        run: docker run --rm --network none -v "$PWD:/source:ro" zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /source --redact --no-banner
      - name: Serialized lint, contracts, migrations, builds, transport and recovery
        env:
          VERDE2_QUALIFICATION_SCOPE: full
        run: node scripts/qualify.mjs
      - name: Dependency and image gates with SBOM
        run: node scripts/scan-images.mjs
      - name: Sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitized-qualification
          path: |
            .qualification/**/evidence.json
            .qualification/**/source-manifest.json
            .qualification/scans/**/*-scan.json
            .qualification/scans/**/*-sbom.json
          retention-days: 7
          if-no-files-found: error
